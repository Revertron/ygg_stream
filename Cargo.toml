[package]
name = "ygg_stream"
version = "0.1.7"
edition = "2024"
authors = ["Revertron"]
description = "Stream multiplexing library for Yggdrasil mesh network"
license = "MPL-2.0"

[dependencies]
ironwood = { git = "https://github.com/Revertron/Yggdrasil-ng", tag = "v0.1.2" }
yggdrasil = { git = "https://github.com/Revertron/Yggdrasil-ng", tag = "v0.1.2"  }
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt", "codec"] }
bytes = "1"
thiserror = "2"
tracing = "0.1"
serde_json = "1"
hex = "0.4"
rand = "0.8"
ed25519-dalek = { version = "2", features = ["rand_core"] }
uniffi = { version = "0.31.0", features = ["build", "cli"], optional = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[target.'cfg(target_os = "android")'.dependencies]
tracing-android = "0.2"

[features]
default = []
ffi = ["uniffi"]

[dev-dependencies]

[lib]
name = "ygg_stream"
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "uniffi-bindgen"
path = "uniffi-bindgen.rs"
test = false
required-features = ["ffi"]

[[example]]
name = "echo"
path = "examples/echo.rs"

[[example]]
name = "client"
path = "examples/client.rs"

[[example]]
name = "full_node"
path = "examples/full_node.rs"